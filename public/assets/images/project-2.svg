<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="p2Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
  </defs>
  <rect width="600" height="360" fill="url(#p2Grad)"/>
  
  <!-- Window Header -->
  <rect x="24" y="20" width="552" height="38" rx="8" fill="#18181b" stroke="#312e81" stroke-width="1"/>
  <circle cx="48" cy="39" r="5" fill="#ef4444"/>
  <circle cx="66" cy="39" r="5" fill="#eab308"/>
  <circle cx="84" cy="39" r="5" fill="#22c55e"/>
  <text x="110" y="44" fill="#a5b4fc" font-family="monospace" font-size="12" font-weight="bold">SentinelOS // Security &amp; Defensive Intelligence</text>
  <rect x="430" y="28" width="130" height="22" rx="4" fill="#312e81"/>
  <text x="444" y="43" fill="#e0e7ff" font-family="sans-serif" font-size="11">● Defense Active</text>

  <!-- Left Panel: Security Shield & Status -->
  <rect x="24" y="74" width="220" height="150" rx="8" fill="#0f172a" fill-opacity="0.9" stroke="#3730a3" stroke-width="1"/>
  <polygon points="134,92 170,104 170,135 134,160 98,135 98,104" fill="url(#shieldGrad)" stroke="#c7d2fe" stroke-width="2"/>
  <text x="134" y="132" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">✓</text>
  <text x="134" y="184" fill="#c7d2fe" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">System Protected</text>
  <text x="134" y="204" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">0 Critical Vulnerabilities</text>

  <!-- Right Panel: Monitoring Metrics -->
  <rect x="260" y="74" width="316" height="150" rx="8" fill="#0f172a" fill-opacity="0.9" stroke="#3730a3" stroke-width="1"/>
  <text x="276" y="98" fill="#e0e7ff" font-family="sans-serif" font-size="12" font-weight="bold">Modular Subsystems</text>
  
  <rect x="276" y="112" width="284" height="28" rx="4" fill="#1e1b4b"/>
  <text x="288" y="130" fill="#a5b4fc" font-family="monospace" font-size="11">Core Engine: memory/database</text>
  <text x="520" y="130" fill="#22c55e" font-family="monospace" font-size="11">OK</text>
  
  <rect x="276" y="148" width="284" height="28" rx="4" fill="#1e1b4b"/>
  <text x="288" y="166" fill="#a5b4fc" font-family="monospace" font-size="11">Plugins: tools/process_scanner</text>
  <text x="520" y="166" fill="#22c55e" font-family="monospace" font-size="11">OK</text>
  
  <rect x="276" y="184" width="284" height="28" rx="4" fill="#1e1b4b"/>
  <text x="288" y="202" fill="#a5b4fc" font-family="monospace" font-size="11">Logs: feature/memory streaming</text>
  <text x="520" y="202" fill="#22c55e" font-family="monospace" font-size="11">LIVE</text>

  <!-- Bottom Terminal Log -->
  <rect x="24" y="240" width="552" height="96" rx="8" fill="#09090b" stroke="#1f2937" stroke-width="1"/>
  <text x="40" y="266" fill="#818cf8" font-family="monospace" font-size="11">root@sentinel-core:~# python main.py --mode=defensive-monitor</text>
  <text x="40" y="288" fill="#34d399" font-family="monospace" font-size="11">[+] Plugins loaded: network_scanner, memory_inspector, log_rotator</text>
  <text x="40" y="310" fill="#94a3b8" font-family="monospace" font-size="11">[*] Sentinel daemon listening on localhost:8080</text>
</svg>
